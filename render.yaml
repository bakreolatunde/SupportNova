# Render.com blueprint — https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub, then "New +" -> "Blueprint" on Render, point at the repo.
services:
  - type: web
    name: supportnova
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn src.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GENAI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false   # set manually in the Render dashboard — never commit real keys
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./supportnova.db
